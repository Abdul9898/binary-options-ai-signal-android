name: Build Binary Options AI Signal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias binarysignal \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass binaryoptions \
              -keypass binaryoptions \
              -dname "CN=BinarySignal,OU=Trading,O=AISignal,C=US"
          fi

      - name: Build Release APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/BinaryOptionsAISignal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinaryOptionsAISignal-APK
          path: output/BinaryOptionsAISignal.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: Binary Options AI Signal v1.3.0
          body: |
            ### ⚡ Binary Options AI Signal v1.3.0 (Unrestricted Release)
            - **No License Key Required:** Instant direct access to live signals dashboard.
            - **Live Signal Engine:** Real-time CALL / PUT signals with confidence %, strike price, and countdown timer.
            - **Technical Confluence:** Built-in RSI (14), Bollinger Bands, and EMA momentum detection.
            - **Win Rate Scorecard:** Automatic live trade tracking and win-rate statistics.
            - **Cyber Dark Theme:** OLED-friendly aesthetic with high-res branding.
          files: output/BinaryOptionsAISignal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
