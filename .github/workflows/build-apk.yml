name: Build Binary Options AI Signal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias binarysignal \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass binaryoptions \
              -keypass binaryoptions \
              -dname "CN=BinarySignal,OU=Trading,O=AISignal,C=US"
          fi

      - name: Build Release APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/BinaryOptionsAISignal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinaryOptionsAISignal-APK
          path: output/BinaryOptionsAISignal.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0
          name: Binary Options AI Signal v2.0.0 (Tick Sniper Edition)
          body: |
            ### ⚡ Binary Options AI Signal v2.0.0 (Tick Sniper Edition)
            - **Tick-by-Tick Microstructure Impulse Engine:** Cracks entries on rapid momentum bursts before tick close.
            - **5-Tick / Turbo Settlement:** Real-time tick countdown (`1/5`, `2/5`, `3/5`, `4/5`, `5/5`) and instant win/loss settlement.
            - **Anti-Falling-Knife Guard:** Prevents false reversal buys during micro-crashes.
            - **Multi-Feed Streaming:** Live Deriv Volatility Indices (`1HZ100V`, `R_100`) + Binance Live Trade WebSocket + 24/7 OTC Forex.
            - **Zero Restrictions:** Completely unlocked release with vibration alerts and live win-rate tracker.
          files: output/BinaryOptionsAISignal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
